# ~/.config/kitty/kitty.conf

# ---- Fuente ----
+ font_family      JetBrains Mono Light
+ bold_font        JetBrains Mono
+ italic_font      JetBrains Mono Italic
+ bold_italic_font JetBrains Mono Bold Italic

# ---- Transparencia / blur (efecto "vidrio" como en las capturas) ----
background_opacity 0.25
dynamic_background_opacity yes
background_blur 20

# ---- Cursor y selección ----
cursor_shape            beam
cursor_blink_interval    0
selection_foreground     none

# ---- Ventana ----
window_padding_width    10
hide_window_decorations  yes
confirm_os_window_close  0

# ---- Barra de pestañas (minimal, estilo powerline) ----
tab_bar_edge             top
tab_bar_style             powerline
tab_powerline_style       slanted
tab_title_template        "{title}"

# Alternatively copy paste below directly into kitty.conf

foreground            #f8f8f2
background            #282a36
selection_foreground  #ffffff
selection_background  #44475a

url_color #8be9fd

# black
color0  #3a3a4e
color8  #7a7a8e

# red
color1  #c9a9a9
color9  #dcc4c4

# green
color2  #8db88d
color10 #acd4ac

# yellow
color3  #c9c5a9
color11 #dcdcc4

# blue
color4  #8fb5c9
color12 #afd4e0

# magenta
color5  #c9a9c5
color13 #dcc4d8

# cyan
color6  #8db8b8
color14 #acdcdc

# white
color7  #d0d0d8
color15 #efefef

# Cursor colors
cursor            #f8f8f2
cursor_text_color background

# Tab bar colors
active_tab_foreground   #282a36
active_tab_background   #f8f8f2
inactive_tab_foreground #282a36
inactive_tab_background #6272a4

# Marks
mark1_foreground #282a36
mark1_background #ff5555

# Splits/Windows
active_border_color #f8f8f2
inactive_border_color #6272a4

# ---- Barra de título / bordes de ventana activa ----
active_border_color    #6FA8DC
inactive_border_color  #3C3E44
